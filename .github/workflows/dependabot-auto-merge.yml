name: Dependabot Auto Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot PR number to re-evaluate with the full policy
        required: true
        type: string
      dry_run:
        description: Validate only; never create an App token or merge
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || fromJSON(inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  dependabot:
    name: Dependabot Auto Merge
    if: >-
      github.repository == 'jplayout/CollectionMgnt' &&
      ((github.event_name == 'pull_request_target' &&
        github.actor == 'dependabot[bot]' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Explicit activation after Actions-secret migration and a successful dry run.
      MERGE_ENABLED: ${{ vars.DEPENDABOT_DIRECT_MERGE_ENABLED }}
    steps:
      - name: Load controller from the trusted main revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Validate canonical PR number and decide strict write authorization
        id: guard
        run: node .github/scripts/dependabot-auto-merge.mjs guard

      - name: Check Actions secret availability without revealing values
        env:
          DRY_RUN: ${{ steps.guard.outputs.dry_run }}
          HAS_CLIENT_ID: ${{ secrets.DEPENDABOT_MERGER_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.DEPENDABOT_MERGER_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_CLIENT_ID" != 'true' || "$HAS_PRIVATE_KEY" != 'true' ]]; then
            echo 'Required Actions secrets are unavailable; migrate them before activation.'
            if [[ "$DRY_RUN" != 'true' ]]; then exit 1; fi
          else
            echo 'Both required Actions secrets are available (values are never printed).'
          fi

      - name: Validate eligibility and wait at most 45 minutes for required checks
        id: candidate
        env:
          DRY_RUN: ${{ steps.guard.outputs.dry_run }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_PATH: ${{ runner.temp }}/dependabot-merge-candidate-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node .github/scripts/dependabot-auto-merge.mjs prepare

      - name: Create scoped Dependabot Merger token at the last moment
        id: app-token
        if: fromJSON(steps.guard.outputs.allow_write || 'false') && steps.candidate.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPENDABOT_MERGER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Revalidate and merge the exact head through REST
        if: fromJSON(steps.guard.outputs.allow_write || 'false') && steps.candidate.outputs.ready == 'true'
        env:
          DRY_RUN: ${{ steps.guard.outputs.dry_run }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_PATH: ${{ runner.temp }}/dependabot-merge-candidate-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node .github/scripts/dependabot-auto-merge.mjs merge

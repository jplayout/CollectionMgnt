name: Trivy Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan backend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          vuln-type: library
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          vuln-type: library
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build backend image
        run: CONTAINER_ENGINE=docker node scripts/container.mjs build backend -t collectionmgnt-backend:trivy

      - name: Build frontend image
        run: CONTAINER_ENGINE=docker node scripts/container.mjs build frontend -t collectionmgnt-frontend:trivy

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: collectionmgnt-backend:trivy
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: collectionmgnt-frontend:trivy
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

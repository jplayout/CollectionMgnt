
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?Use node scripts/container.mjs compose to read VERSION}
        APP_REVISION: ${APP_REVISION:-development}
        APP_SOURCE: ${APP_SOURCE:-https://github.com/jplayout/CollectionMgnt}
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      DATA_DIR: ${DATA_DIR:-/app/data}
      PLUGINS_DIR: ${PLUGINS_DIR:-/app/plugins}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/data:${DATA_DIR:-/app/data}:Z
      - ./backend/plugins:${PLUGINS_DIR:-/app/plugins}:ro,Z

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?Use node scripts/container.mjs compose to read VERSION}
        APP_REVISION: ${APP_REVISION:-development}
        APP_SOURCE: ${APP_SOURCE:-https://github.com/jplayout/CollectionMgnt}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
